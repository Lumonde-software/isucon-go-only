---
- name: install xbuild
  become: yes
  become_user: isucon
  git:
    repo: https://github.com/tagomoris/xbuild.git
    dest: /tmp/xbuild
    version: master

- name: Install Node v14.9.0
  become: yes
  become_user: isucon
  command: /tmp/xbuild/node-install v14.9.0 /home/isucon/local/node

- name: Add PATH for Node
  become: yes
  become_user: isucon
  blockinfile:
    marker: "# {mark} ANSIBLE MANAGED BLOCK Node"
    path: /home/isucon/.bashrc
    content: |
      export PATH=/home/isucon/local/node/bin:$PATH


- name: Install Go 1.14.7
  become: yes
  become_user: isucon
  command: /tmp/xbuild/go-install 1.14.7 /home/isucon/local/go {{ ansible_system | lower }} {{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}

- name: Add PATH for Go
  become: yes
  become_user: isucon
  blockinfile:
    marker: "# {mark} ANSIBLE MANAGED BLOCK go"
    path: /home/isucon/.bashrc
    content: |
      export PATH=/home/isucon/local/go/bin:/home/isucon/go/bin:$PATH
      export GOROOT=/home/isucon/local/go

# Python 3.8/3.9 は OpenSSL 3.0 (Ubuntu 22.04) でビルドできない(ssl モジュールが
# 欠落し pip が動かない)ため、OpenSSL 3.0 対応の 3.11 系に変更
- name: Install python v3.11.9
  become: yes
  become_user: isucon
  command: /tmp/xbuild/python-install 3.11.9 /home/isucon/local/python

- name: Add PATH for python
  become: yes
  become_user: isucon
  blockinfile:
    marker: "# {mark} ANSIBLE MANAGED BLOCK python"
    path: /home/isucon/.bashrc
    content: |
      export PATH=/home/isucon/local/python/bin:$PATH
