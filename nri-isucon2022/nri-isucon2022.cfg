#cloud-config

timezone: Asia/Tokyo

packages:
  - ansible
  - git

runcmd:
  - |
    set -e

    # https://github.com/ansible/ansible/issues/31617
    export HOME=/root

    GITDIR="/tmp/nri-isucon2022"
    rm -rf ${GITDIR} /tmp/isucon-go-only
    git clone --depth=1 --filter=blob:none --sparse https://github.com/Lumonde-software/isucon-go-only.git /tmp/isucon-go-only
    git -C /tmp/isucon-go-only sparse-checkout set nri-isucon2022
    mv /tmp/isucon-go-only/nri-isucon2022 ${GITDIR}
    rm -rf /tmp/isucon-go-only
    (
      cd ${GITDIR}/provisioning/ansible
      sed -i -e '/timezone/d' roles/common/tasks/main.yaml
      sed -i -e '/go-install/s/command:\(.*\)$/shell:\1 `uname -s | tr "[A-Z]" "[a-z]"` `dpkg --print-architecture`/' roles/langs/tasks/main.yaml
      ansible-playbook -i standalone.hosts --connection=local standalone.yaml
    )
    rm -rf ${GITDIR}
